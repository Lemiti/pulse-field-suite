[package]
name = "backend"
version = "0.1.0"
edition = "2021"

[dependencies]
# Web Framework & Async
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }

# Database (Postgres)
sqlx = { version = "0.7", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "rust_decimal"] }
rust_decimal = { version = "1.33", features = ["serde"] }

# Serialization & Types
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
uuid = { version = "1.7", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }

# The TS Bridge (Swapped to ts-rs for absolute stability)
ts-rs = { version = "8.1", features = ["uuid-impl", "chrono-impl"] }

# Environment & Utils
dotenvy = "0.15"
tracing = "0.1"
tracing-subscriber = "0.3"

jsonwebtoken = "9.3"
