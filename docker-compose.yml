version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: pulse-field-db
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: pulse_field
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d pulse_field"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pulse-field-app
    restart: always
    ports:
      - "8080:8080"
    environment:
      APP_ENV: production
      DATABASE_URL: postgres://postgres:postgres@db:5432/pulse_field
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      HOST: 0.0.0.0
      PORT: 8080
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
